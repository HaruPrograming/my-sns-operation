version: "3.8"

services:
  app:
    build: ./docker/php
    container_name: my_sns_app
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sns_db
      DB_USERNAME: sns_user
      DB_PASSWORD: sns_password
    command: sh -c "[ -f /var/www/html/vendor/autoload.php ] || composer install --no-interaction && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: my_sns_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  frontend:
    image: node:24-alpine
    container_name: my_sns_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  db:
    image: mysql:8.0
    container_name: my_sns_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sns_db
      MYSQL_USER: sns_user
      MYSQL_PASSWORD: sns_password
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vendor_data:
